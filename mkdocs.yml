  # overrides/main.html: Physics pages get `physics`, Conducting pages get
  # `conducting`, Tutoring gets none, everything else gets `all`.
  # Paths are relative to docs/. Add or remove lines freely.
  background_interval: 6000
  backgrounds:
    all:
      - Conducting/musicphotos/picture-gallery-concert.jpg
      - Physics/media/quirk-lecture-theatre.jpg
      - Conducting/musicphotos/rehearsal-conducting.jpg
      - Physics/media/summer-project-2025.jpg
      - Conducting/musicphotos/masterclass-2.jpg
      - Physics/media/quirk-slide.jpg
      - Conducting/musicphotos/concol-2025.jpg
      - Physics/media/20250215_163746286.JPG
    physics:
      - Physics/media/quirk-lecture-theatre.jpg
      - Physics/media/summer-project-2025.jpg
      - Physics/media/quirk-slide.jpg
      - Physics/media/20250215_132930350.JPG
      - Physics/media/20250215_163746286.JPG
      - Physics/media/campus.jpg
    conducting:
      - Conducting/musicphotos/picture-gallery-concert.jpg
      - Conducting/musicphotos/rehearsal-conducting.jpg
      - Conducting/musicphotos/masterclass-1.jpg
      - Conducting/musicphotos/masterclass-2.jpg
      - Conducting/musicphotos/concol-2025.jpg
      - Conducting/musicphotos/colin-metters-masterclass.jpg
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/conradkhho
      name: GitHub
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/playlist?list=PLC4E8-OVLFsc
      name: Conducting portfolio
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/conrad-ho-11574530a/
      name: LinkedIn
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/conradho._.music/
      name: Instagram
    - icon: material/email
      link: mailto:conradkhho@gmail.com
      name: Email
