site_name: Conrad Ho
site_description: Theoretical physicist and orchestral conductor — Royal Holloway, University of London.
site_url: https://conradkhho.github.io/

nav:
  - Home: index.md
  - Physics:
      - Overview: Physics/index.md
      - Research:
          - Projects: Physics/research/projects.md
          - Presentations & conferences: Physics/research/presentations.md
      - Gallery: Physics/gallery.md
  - Conducting:
      - Conducting/index.md
      - Biography: Conducting/biography.md
      - Repertoire: Conducting/repertoire.md
      - Media: Conducting/media.md
      - Concerts: Conducting/concerts/index.md
      - Enquiries: Conducting/enquiries.md
  - Tutoring: tutoring.md
  - Contact: contact.md

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/home
  favicon: photos/DSC05650.JPG
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.footer
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.code.select
    - content.code.annotate

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [snippets]
  - pymdownx.superfences
  - pymdownx.blocks.caption

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      draggable: false
      skip_classes: [no-lightbox]

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/booking.js
  - javascripts/rotator.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
